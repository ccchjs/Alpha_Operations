name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'AiremoreApp/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'AiremoreApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: AiremoreApp

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: AiremoreApp/app/build/outputs/apk/debug/*.apk
